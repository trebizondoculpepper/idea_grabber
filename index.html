<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#361477" />
    <title>Idea Grabber</title>
    <meta
      name="description"
      content="Join Coinie and Bulbee in a colourful arcade. Grab a capsule, mix game genres, and discover your next wild game idea."
    />
    <link rel="canonical" href="https://idea-grabber.fly.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Idea Grabber" />
    <meta property="og:title" content="Idea Grabber" />
    <meta
      property="og:description"
      content="Join Coinie and Bulbee in a colourful arcade. Grab a capsule, mix game genres, and discover your next wild game idea."
    />
    <meta property="og:url" content="https://idea-grabber.fly.dev/" />
    <meta
      property="og:image"
      content="https://idea-grabber.fly.dev/social/idea-grabber-preview.jpg"
    />
    <meta
      property="og:image:secure_url"
      content="https://idea-grabber.fly.dev/social/idea-grabber-preview.jpg"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Bulbee the smiling lightbulb and Coinie the cheerful gold coin waving in front of the colourful Idea Grabber claw machine."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Idea Grabber" />
    <meta
      name="twitter:description"
      content="Grab a capsule with Coinie and Bulbee, mix game genres, and discover your next wild game idea."
    />
    <meta
      name="twitter:image"
      content="https://idea-grabber.fly.dev/social/idea-grabber-preview.jpg"
    />
    <meta
      name="twitter:image:alt"
      content="Bulbee and Coinie waving in front of the Idea Grabber claw machine."
    />
  </head>
  <body>
    <main id="app">
      <canvas
        id="scene"
        role="img"
        aria-label="Idea Grabber: a colourful 3D claw machine with colourful capsules with game-genre icons, Bulbee the lightbulb and Coinie the coin, in a cartoon arcade."
      ></canvas>
      <h1 class="visually-hidden">Idea Grabber</h1>
      <div class="audio-controls" role="group" aria-label="Audio controls">
        <button
          id="music-toggle"
          class="music-control"
          type="button"
          aria-label="Stop music"
          data-playing="false"
        >
          <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#159447" d="M5 3v18l16-9z" />
          </svg>
          <svg class="stop-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#000" d="M4 4h16v16H4z" />
          </svg>
        </button>
        <button
          id="music-next"
          class="music-control"
          type="button"
          aria-label="Next song"
          title="Next song"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#000" d="M4 3v18l13-9zM18 3h3v18h-3z" />
          </svg>
        </button>
        <button
          id="mute-sound"
          class="sound-toggle"
          type="button"
          aria-pressed="false"
        >
          Mute sound
        </button>
      </div>
      <button id="insert-coinie" class="keyboard-action" type="button">
        Insert Coinie
      </button>
      <p
        id="coinie-status"
        class="visually-hidden"
        role="status"
        aria-live="polite"
      >
        Coinie is walking in from the right.
      </p>
      <p
        id="bulbee-speech"
        class="speech-bubble"
        role="status"
        aria-live="polite"
        aria-label="Bulbee says"
        hidden
      ></p>
      <p
        id="coinie-speech"
        class="speech-bubble coinie-bubble"
        role="status"
        aria-live="polite"
        aria-label="Coinie says"
        hidden
      ></p>
      <p id="error" role="alert" hidden></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
