<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#361477" />
    <title>Idea Grabber</title>
  </head>
  <body>
    <main id="app">
      <canvas
        id="scene"
        role="img"
        aria-label="Idea Grabber: a colourful 3D claw machine with colourful capsules with game-genre icons, Bulbee the lightbulb and Coinie the coin, in a cartoon arcade."
      ></canvas>
      <h1 class="visually-hidden">Idea Grabber</h1>
      <button id="insert-coinie" class="keyboard-action" type="button">
        Insert Coinie
      </button>
      <p
        id="coinie-status"
        class="visually-hidden"
        role="status"
        aria-live="polite"
      >
        Coinie is walking in from the right.
      </p>
      <p
        id="bulbee-speech"
        class="speech-bubble"
        role="status"
        aria-live="polite"
        aria-label="Bulbee says"
        hidden
      ></p>
      <p
        id="coinie-speech"
        class="speech-bubble coinie-bubble"
        role="status"
        aria-live="polite"
        aria-label="Coinie says"
        hidden
      ></p>
      <p id="error" role="alert" hidden></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
